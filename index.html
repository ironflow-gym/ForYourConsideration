
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Your Consideration</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0c0a09">
    <meta name="description" content="A sophisticated PWA for tracking movie awards and nominations.">
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FYC Awards">
    <link rel="apple-touch-icon" href="https://fav.farm/🏆">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c0a09;
            color: #f5f5f4;
            margin: 0;
            padding: 0;
            /* Prevent pull-to-refresh on mobile for a more app-like feel */
            overscroll-behavior-y: contain;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f9e29c 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .movie-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .movie-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.2);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1917;
        }
        ::-webkit-scrollbar-thumb {
            background: #44403c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }
        
        /* PWA specific safe-area adjustments */
        header {
            padding-top: env(safe-area-inset-top);
        }
        nav {
            padding-bottom: calc(0.875rem + env(safe-area-inset-bottom));
        }
    </style>
    <!-- Process Shim: Prevents 'process is not defined' errors in browser when using SDKs -->
    <script>
        window.process = { env: { NODE_ENV: 'production' } };
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
